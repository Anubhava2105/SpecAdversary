[mypy]
python_version = 3.12
# Incremental adoption: flag real bugs (undefined names, wrong arity,
# impossible calls) without demanding annotations across the whole codebase.
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (?x)(
    alembic/versions/ |
    .venv/
  )

[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-tavily.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
