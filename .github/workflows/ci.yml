name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-types:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --exclude .venv
      - run: python -m mypy main.py auth.py broker.py database.py models.py pipeline_runner.py risk_service.py worker.py logging_config.py llm_gateway.py graph.py scripts/backfill_risks.py

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Available for integration-style tests and the migration smoke job;
      # the pytest suite itself runs against in-memory SQLite for isolation.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: specadv
          POSTGRES_PASSWORD: specadv
          POSTGRES_DB: specadv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U specadv -d specadv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://specadv:specadv@localhost:5432/specadv_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  migrations-and-health:
    name: Migrations & health check (Postgres/Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: [backend-lint-types, backend-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: specadv
          POSTGRES_PASSWORD: specadv
          POSTGRES_DB: specadv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U specadv -d specadv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://specadv:specadv@localhost:5432/specadv
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Replay the full migration chain on the production dialect.
      - run: alembic upgrade head
      # The one-time legacy backfill must be idempotent on an empty DB too.
      - run: python scripts/backfill_risks.py
      # Boot the API against real dependencies; /healthz must report all-ok.
      - run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:8000/healthz || true)
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          echo "/healthz never became healthy"; cat /tmp/health.json || true; exit 1

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci fails if package.json and package-lock.json disagree,
      # which enforces the pinned-dependency policy.
      - run: npm ci
      - run: npm run lint
      - run: npm run build
