services:
  redis:
    image: redis:7-alpine
    # Authenticated, memory-bounded, append-only disabled: the queue is
    # rebuildable from AnalysisRun rows, so durability is unnecessary.
    command: >
      sh -c 'exec redis-server
      --requirepass "$${REDIS_PASSWORD}"
      --maxmemory 128mb
      --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specadv
      POSTGRES_PASSWORD: specadv
      POSTGRES_DB: specadv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specadv -d specadv"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://specadv:specadv@db:5432/specadv
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, default]

  worker:
    build: ./backend
    command: python worker.py
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://specadv:specadv@db:5432/specadv
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  frontend:
    build: ./frontend
    ports: ["5174:5174"]
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]

volumes:
  pgdata:

networks:
  # Data services (redis, db, worker) are isolated from the host and the
  # frontend; only backend bridges both worlds.
  internal: {}
