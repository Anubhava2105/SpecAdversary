services:
  redis:
    image: redis:7-alpine
    # Authenticated, memory-bounded, append-only disabled: the queue is
    # rebuildable from AnalysisRun rows, so durability is unnecessary.
    command: >
      sh -c 'exec redis-server
      --requirepass "$${REDIS_PASSWORD}"
      --maxmemory 128mb
      --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specadv
      POSTGRES_PASSWORD: specadv
      POSTGRES_DB: specadv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specadv -d specadv"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  # One-shot release step: owns `alembic upgrade head` so concurrent web
  # replicas never race on migration locks. Backend and worker start only
  # after it completes successfully.
  migrate:
    build: ./backend
    command: sh scripts/migrate.sh
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://specadv:specadv@db:5432/specadv
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://specadv:specadv@db:5432/specadv
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # /healthz pings Postgres and Redis; the app is only "up" when both answer.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal, default]

  worker:
    build: ./backend
    command: python worker.py
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://specadv:specadv@db:5432/specadv
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Sync DB sessions inside async jobs block the loop: keep in-process
      # concurrency small, scale with replicas instead (see worker.py).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker has no HTTP surface; a healthy Redis round-trip means the
    # process is alive and its event loop isn't blocked.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; r=redis.from_url(os.environ['REDIS_URL']); r.ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [internal]

  frontend:
    build: ./frontend
    ports: ["5174:5174"]
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]

volumes:
  pgdata:

networks:
  # Data services (redis, db, worker) are isolated from the host and the
  # frontend; only backend bridges both worlds.
  internal: {}
